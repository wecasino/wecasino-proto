syntax = "proto3";
package games.luckywheel;

enum GameSubtype {
  // 未指定
  LUCKYWHEEL_TYPE_UNSPECIFIED = 0;

  // 經典幸運輪
  LUCKYWHEEL_CLASSIC = 1;
}

// 步驟，依據遊戲供應商邏輯，不是每個步驟都會走到
enum Step {

  // 未指定
  STEP_UNSPECIFIED = 0;

  // 本局開始
  ROUND_START = 1;

  // 本局完成
  ROUND_FINISHED = 2;

  // 開放下注
  ROUND_BET = 4;
  
  // 停止下注
  NO_MORE_BET = 5;

  // 轉盤
  SPIN_WHEEL = 8;

}
