syntax = "proto3";
package games.baccarat;

enum GameSubtype {
    // 未指定
    BACCARAT_TYPE_UNSPECIFIED = 0;

    // 經典百家樂
    BACCARAT_CLASSIC = 1;

    // 極速百家樂
    BACCARAT_SPEED = 3;

    // 百家樂恆8
    BACCARAT_FOREVER8 = 4;

    // 百家樂恆9
    BACCARAT_FOREVER9 = 5;

    // 財神百家樂
    BACCARAT_FORTUNE = 12;

    // 搖錢樹百家樂
    BACCARAT_TREE = 13;

}

enum ResourceType {

  // 未指定
  RESOURCE_TYPE_UNSPECIFIED = 0;

  // 例牌
  NORMAL = 1;

  // 非例牌
  EXTRA = 2;

}

// 經典百家樂實際會走到的步驟。走地、瞇牌各自使用自己的 Step。
enum Step {

  // 未指定
  STEP_UNSPECIFIED = 0;

  // 本局開始
  ROUND_START = 1;

  // 本局完成
  ROUND_FINISHED = 2;

  // 展示第一張牌
  SHOW_FIRST_CARD = 3;

  // 開放下注
  ROUND_BET = 8;
  // 停止下注
  NO_MORE_BET = 9;

  // 開例牌
  SHOW_NORMAL = 11;

  // 派發牌
  DEAL_CARDS = 35;

  // 補閒家牌
  DEAL_PLAYER_EXTRA = 16;

  // 補莊家牌
  DEAL_BANKER_EXTRA = 20;

  // 荷官確認
  DEALER_CONFIRM = 23;

}

// 座位功能代碼
enum GameSeat {

  // 未指定
  SEAT_UNSPECIFIED = 0;

  // 閒家
  PLAYER = 2;
  
  // 莊家
  BANKER = 3;

}
